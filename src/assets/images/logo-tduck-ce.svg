<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 36" width="180" height="36">
  <defs>
    <!-- Blue Gradient for the Badge -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3370ff" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Subtle Glow Drop Shadow for the Badge -->
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3370ff" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .brand-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 32px;
      fill: #3370ff;
      letter-spacing: -0.8px;
    }
    .badge-rect {
      fill: url(#badge-grad);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 13px;
      fill: #ffffff;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Brand Name: TDUCK -->
  <text x="8" y="31" class="brand-text">TDUCK</text>

  <!-- CE Badge Capsule -->
  <rect x="128" y="6" width="44" height="24" rx="7" class="badge-rect" filter="url(#glow-shadow)" />

  <!-- Badge Text: CE -->
  <text x="150" y="23" text-anchor="middle" class="badge-text">CE</text>
</svg>
